name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migration compatibility
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --test scripts/db-migration-history.test.mjs
          pnpm migration:compatibility:check

      - name: Check harness state
        run: pnpm harness:check

      - name: Verify published deployment measurements
        run: python3 .eval/verify_results.py

      - name: Test application packages and deployment safety
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/sketchcatch_test
        run: |
          pnpm exec turbo test --continue=always
          pnpm test:sandbox-e2e
          pnpm test:terraform-import-safety

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
